<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1"
		/>
		<title>Snake</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: black;
				overflow: hidden;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				image-rendering: pixelated;
				image-rendering: crisp-edges;
				touch-action: none;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas" width="640" height="480">
			HTML5 canvas appears to be unsupported in the current browser.
			<br />
			Please try updating or use a different browser.
		</canvas>
		<script>
			// The wasm is shipped gzip-compressed (snake.wasm.gz) to stay under hosting
			// per-file size limits, so decompress it at runtime before instantiation.
			// Sniff the gzip magic bytes in case the server already decoded the body
			// via `Content-Encoding: gzip`.
			var Module = {
				instantiateWasm: async function (info, receiveInstance) {
					const response = await fetch('snake.wasm.gz');
					const bytes = new Uint8Array(await response.arrayBuffer());
					let buffer;
					if (bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
						const stream = new Blob([bytes])
							.stream()
							.pipeThrough(new DecompressionStream('gzip'));
						buffer = await new Response(stream).arrayBuffer();
					} else {
						buffer = bytes.buffer;
					}
					const { instance } = await WebAssembly.instantiate(buffer, info);
					receiveInstance(instance);
					return instance.exports;
				},
			};
		</script>
		<script src="snake.js"></script>
	</body>
</html>
